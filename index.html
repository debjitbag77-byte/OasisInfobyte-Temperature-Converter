<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TempFlow — Temperature Converter</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070812;color:#f5f7ff;font-family:"DM Sans",sans-serif;padding:25px}.box{width:min(720px,100%);background:#101321;border:1px solid #ffffff16;border-radius:30px;padding:42px;box-shadow:0 30px 100px #0009}.brand{font:700 20px "Space Grotesk";color:#22d3ee}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#a78bfa;font-weight:700;font-size:13px;margin-top:35px}.title{font:700 clamp(40px,7vw,65px)/1 "Space Grotesk";margin:10px 0;background:linear-gradient(110deg,#fff,#a78bfa,#22d3ee);-webkit-background-clip:text;color:transparent}.sub{color:#a5abc1;line-height:1.6}.form{display:grid;grid-template-columns:1fr 180px;gap:14px;margin-top:30px}input,select,button{width:100%;padding:16px;border-radius:13px;border:1px solid #ffffff18;background:#15192a;color:#fff;font:inherit}button{grid-column:1/-1;background:linear-gradient(110deg,#8b5cf6,#22d3ee);border:0;font-weight:700;cursor:pointer}.error{color:#fb7185;min-height:24px;margin:14px 0}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}.result{background:#0b0e19;border:1px solid #ffffff12;border-radius:17px;padding:20px}.result span{display:block;color:#a5abc1;font-size:13px}.result strong{display:block;font:700 25px "Space Grotesk";margin-top:8px}.tip{color:#22d3ee;text-align:center;margin-top:25px}@media(max-width:600px){.box{padding:25px}.form,.results{grid-template-columns:1fr}.form button{grid-column:auto}}
</style></head><body><main class="box"><div class="brand">NOVA<span>FORGE</span></div><div class="eyebrow">OASIS INFOBYTE · Task 3</div><h1 class="title">TempFlow</h1><p class="sub">Convert Celsius, Fahrenheit and Kelvin with validation and absolute-zero protection.</p><form id="tempForm" class="form"><input id="temperature" type="number" step="any" placeholder="Enter temperature" required><select id="unit" aria-label="Temperature unit"><option value="C">Celsius (°C)</option><option value="F">Fahrenheit (°F)</option><option value="K">Kelvin (K)</option></select><button type="submit">Convert Temperature →</button></form><div id="error" class="error"></div><section class="results"><div class="result"><span>Celsius</span><strong id="cResult">—</strong>°C</div><div class="result"><span>Fahrenheit</span><strong id="fResult">—</strong>°F</div><div class="result"><span>Kelvin</span><strong id="kResult">—</strong>K</div></section><div id="tip" class="tip">Enter a value to begin.</div></main><script>
const form=document.getElementById("tempForm"),temperature=document.getElementById("temperature"),unit=document.getElementById("unit"),error=document.getElementById("error"),c=document.getElementById("cResult"),f=document.getElementById("fResult"),k=document.getElementById("kResult"),tip=document.getElementById("tip");
const fmt=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
form.addEventListener("submit",e=>{e.preventDefault();error.textContent="";let v=Number(temperature.value),u=unit.value;if(temperature.value.trim()===""||!Number.isFinite(v)){error.textContent="Please enter a valid numeric temperature.";return}let C=u==="C"?v:u==="F"?(v-32)*5/9:v-273.15;if(C<-273.15-1e-10){error.textContent="That temperature is below absolute zero (−273.15°C). Please enter a valid value.";return}c.textContent=fmt(C);f.textContent=fmt(C*9/5+32);k.textContent=fmt(C+273.15);tip.textContent="✓ Conversion complete — all three units are shown above."});
</script></body></html>
